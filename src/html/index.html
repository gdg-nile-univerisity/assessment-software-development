<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel = "stylesheet" href = "../css/body.css">
        <link rel = "stylesheet" href = "../css/buttons.css">
        <link rel = "stylesheet" href = "../css/general.css">
    <title>Kawaii To-Do App</title>
</head>
<body>
    <div class = "toggle-button">
        <button id="toggle-mode">🌚</button>
    </div>
    <div class = "header">
        <div class = "header-text">
            <h1>Hi Babushka 🐥</h1>
            <h2>Let's get your life together!</h2>
        </div>
        <div class = "pfp">
            <img src = "../images/cute-meadow.jpg" alt = "profile picture">
        </div>
    </div>

    <div class = "todo-body">
        <div class ="weekdays">
            <div class = "day">Mon</div>
            <div class = "day">Tue</div>
            <div class = "day">Wed</div>
            <div class = "day">Thu</div>
            <div class = "day">Fri</div>
            <div class = "day">Sat</div>
            <div class = "day">Sun</div>
        </div>

        <div class = "mid-section-with-pic">
            <img class ="mid-pic" src ="../images/field.jpg" alt = "mid-rif-pic">
            <div>
                <section class = "motivation" 
                style="background-color: aquamarine;
                font-size: 1.2rem;
                font-weight:bold;
                padding: 80px;
                border-radius: 30px;"
                > 苦あれば楽あり
            </section>
            </div>
        </div>

        <div class = "todo-list">
            <h3>To-Do List</h3>
            
                    <input type="checkbox" id="task1" name="task1">
                    <input type ="text" id ="content" name = "content" placeholder="Add a task!">
                    <br>
                    <br>
                    <input type="checkbox" id="task2" name="task2">
                    <input type ="text" id ="content2" name = "content2" placeholder="Add a task!">
                    <br>
                    <br>
                    <input type="checkbox" id="task3" name="task3">
                    <input type ="text" id ="content3" name = "content3" placeholder="Add a task!">
                    <br>
                    <br>
                    <input type="checkbox" id="task4" name="task4">
                    <input type ="text" id ="content4" name = "content4" placeholder="Add a task!">
                    
        </div>

        <div class = "bottom">
            <div class = "bottom-item">
                <img src = "../images/ho.png" alt = "home icon">
            </div>
            <div class = "bottom-item">
                <img src = "../images/kon.png" alt = "explore">
            </div>
            <div class = "bottom-item">
                <img src = "../images/icons8-calendar-100.png" alt = "track">
            </div>
            <div class = "bottom-item">
                <img src = "../images/icons8-test-account-100.png" alt = "heart icon">
            </div>
        </div>
    </div>
    <script src="../js/script.js"></script>
</body>
</html>
